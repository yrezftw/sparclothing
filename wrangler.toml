name = "sparclothing"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Keep variables added in the Cloudflare dashboard when a new version goes live.
keep_vars = true

# "yes" opens the site to everyone. Until then every page shows "Opening soon",
# except in browsers where the admin password was typed in at /preview
# (src/preview.js).
[vars]
SITE_OPEN = "no"

# Shop pages and the gallery app. The Worker runs first for every request so it
# can forward www. and spårclothing.se, then hands the rest to these files.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Garment gallery (see GALLERY.md)
[[d1_databases]]
binding = "DB"
database_name = "spar-gallery"
database_id = "70ceb927-c153-49b2-bd45-39e35d74cbf3"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "spar-gallery-photos"
jurisdiction = "eu"
